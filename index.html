<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Righe — BLM Bovio Ricambi</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0E2A8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Righe">
<style>
:root{
  --blu:#1E40C9; --blu-d:#0E2A8C; --blu-l:#E8EEFC; --blu-m:#C7D4F7;
  --ink:#1F2630; --ink2:#5B6572; --ink3:#8A93A0; --line:#DDE1E8; --bg:#F4F5F8; --card:#fff;
  --ok:#157347; --ok-l:#E3F4EA; --warn:#B45309; --warn-l:#FDF0DC; --bad:#B42318; --bad-l:#FDE8E6; --vio:#6D3FC4; --vio-l:#EFE8FB;
  --r:14px; --sh:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.ref,.mono{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;background:var(--blu-d);color:#fff;padding:calc(10px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 0 calc(18px + env(safe-area-inset-left));box-shadow:0 2px 10px rgba(10,20,60,.25)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.mark.logo{width:auto;height:auto;padding:6px 10px;border-radius:12px;display:flex;align-items:center}
.mark.logo img{height:36px;width:auto;display:block}
.mark img{max-width:100%;max-height:100%;display:block}
.mark svg{display:block}
.brand b{display:block;font-size:21px;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;opacity:.75;font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.actions{display:flex;align-items:center;gap:12px}
#status{font-size:12.5px;opacity:.85;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blu);border-color:var(--blu);color:#fff}
.top .btn.primary{background:#fff;color:var(--blu-d);border-color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#F0B8B2}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
nav{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#fff;opacity:.72;padding:11px 16px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current=page]{opacity:1;border-bottom-color:#fff}
main{max-width:1180px;margin:0 auto;padding:20px calc(18px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
h1{font-size:24px;margin:4px 0 14px;letter-spacing:-.2px}
h2{font-size:17px;margin:26px 0 10px}
.muted{color:var(--ink2)} .tiny{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px 18px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14.5px}
.banner.warn{background:var(--warn-l);color:#6B3A07;border:1px solid #F0D6A8}
.banner.bad{background:var(--bad-l);color:#7A1B13;border:1px solid #F0B8B2}
.banner.info{background:var(--blu-l);color:var(--blu-d);border:1px solid var(--blu-m)}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--ink2)}
.stat.hot b{color:var(--bad)} .stat.blue b{color:var(--blu)}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:20px 22px;margin-bottom:14px;background:linear-gradient(135deg,var(--blu) 0%,var(--blu-d) 100%);color:#fff;border-radius:18px;box-shadow:var(--sh)}
.hero .big{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero p{margin:2px 0;opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:7px}
.chip i{font-style:normal;font-size:12.5px;background:var(--bg);border-radius:999px;padding:1px 8px;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--blu);border-color:var(--blu);color:#fff}
.chip[aria-pressed=true] i{background:rgba(255,255,255,.22);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 280px;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px 0 42px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%238A93A0' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>") no-repeat 13px center;font-size:17px}
.search:focus,.in:focus,textarea:focus,select:focus{outline:2px solid var(--blu);outline-offset:1px}
select.in,input.in,textarea.in{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;width:100%}
textarea.in{min-height:96px;resize:vertical;line-height:1.45}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:6px 16px;align-items:center;text-align:left;width:100%;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.row:active{background:var(--blu-l)}
.row.gone{background:#FBFAF6;border-style:dashed}
.r-cli{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sub,.r-veh{font-size:13.5px;color:var(--ink2)}
.r-veh{font-weight:600;color:var(--ink);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mar{display:inline-block;min-width:36px;text-align:center;font-size:12px;font-weight:700;background:var(--blu-l);color:var(--blu-d);border-radius:6px;padding:1px 6px;margin-right:6px}
.ref{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13.5px}
.r-desc{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;min-width:90px}
.qty{font-weight:700;font-variant-numeric:tabular-nums;margin-right:2px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--bg);color:var(--ink2)}
.tag.blue{background:var(--blu-l);color:var(--blu-d)} .tag.red{background:var(--bad-l);color:var(--bad)} .tag.amber{background:var(--warn-l);color:var(--warn)} .tag.green{background:var(--ok-l);color:var(--ok)} .tag.vio{background:var(--vio-l);color:var(--vio)}
.empty{text-align:center;padding:42px 20px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
details.cli{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
details.cli>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
details.cli>summary::-webkit-details-marker{display:none}
details.cli>summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--ink3);transform:rotate(0);transition:.15s}
details.cli[open]>summary::after{transform:rotate(90deg)}
.cli-body{padding:0 16px 14px}
.ord{border-top:1px solid var(--line);padding:10px 0}
.ord-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.line{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dotted var(--line);cursor:pointer;flex-wrap:wrap}
.line .d{flex:1 1 220px;min-width:0}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s}
.sheet{width:min(560px,100%);height:100%;background:#fff;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));box-shadow:-8px 0 30px rgba(0,0,0,.2);animation:slide .18s ease-out}
.dlg{margin:auto;width:min(680px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.veil.center{justify-content:center;align-items:center}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.sh-head h3{margin:0;font-size:20px;line-height:1.25}
.x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:15px;margin:10px 0 16px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:600;word-break:break-word}
.field{margin:14px 0} .field>label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:#fff;font-weight:600;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--blu);color:#fff}
.seg button[aria-pressed=true].r-alta{background:var(--warn)} .seg button[aria-pressed=true].r-urgente{background:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.sol{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:14px;flex-wrap:wrap}
.pres{padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:10px;background:var(--bg)}
.pres.gone{background:var(--warn-l);color:#6B3A07} .pres.new{background:var(--blu-l);color:var(--blu-d)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
table.t td.n{font-variant-numeric:tabular-nums;text-align:right} table.t th.n{text-align:right}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cmp button{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
.cmp button[aria-pressed=true]{border-color:var(--blu);outline:2px solid var(--blu)}
.cmp b{font-size:28px;display:block;font-variant-numeric:tabular-nums} .cmp small{color:var(--ink2);display:block;font-size:13px;line-height:1.35}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:10px;align-items:center;margin:8px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left;padding:0}
.bars .t{background:var(--blu-l);border-radius:8px;height:30px;position:relative;overflow:hidden}
.bars .t i{position:absolute;inset:0 auto 0 0;background:var(--blu-m);border-radius:8px}
.bars .t span{position:relative;padding:0 10px;line-height:30px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#18202B;color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .15s}
.mgr{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;align-items:center;margin-top:8px}
.brandrow{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin:6px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dotted var(--line);font-size:14px}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
@media (max-width:820px){
  .row{grid-template-columns:minmax(0,1fr) auto;} .r-veh,.r-part{grid-column:1/2} .r-tags{grid-column:2/3;grid-row:1/4;align-self:start}
  .hero .big{font-size:44px} .two{grid-template-columns:1fr} .mgr{grid-template-columns:1fr}
}
@media print{.top,#toast{display:none}}
.line.gone{opacity:.7} .line .sollbtn{margin-left:auto;min-height:36px} details.cli>summary b{flex:1 1 auto;min-width:0}
.plate{font-size:17px;letter-spacing:.04em;background:#eef1fb;border:1px solid #c9d3f3;border-radius:8px;padding:3px 9px;color:var(--blu-d)} .vmodel{font-weight:600;color:var(--ink2)}
.bdot{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;letter-spacing:.02em;flex:none}
.bimg{width:34px;height:34px;border-radius:9px;object-fit:contain;border:1px solid var(--line);background:#fff;flex:none}
.brandrow{grid-template-columns:70px 1fr auto} .bpick{display:flex;align-items:center;gap:4px} .bthumb{display:inline-flex;cursor:pointer;padding:5px;border-radius:50%;border:1px dashed var(--line)} .bpick .x{width:32px;height:32px}
.bpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:12px 0;max-height:52vh;overflow:auto}
.bp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:12px;line-height:1.2;text-align:center} .bp img{width:48px;height:48px;object-fit:contain} .bp:active{border-color:var(--blu)}
.bthumb{background:#fff}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark" id="mark"></div>
      <div><b>Righe</b><small>BLM Bovio Ricambi</small></div>
    </div>
    <div class="actions">
      <span id="status" aria-live="polite"></span>
      <label class="btn primary" id="pdfBtn" for="pdfIn">Carica PDF</label>
      <input type="file" id="pdfIn" accept="application/pdf,.pdf" hidden>
    </div>
  </div>
  <nav id="nav" aria-label="Sezioni"></nav>
</header>
<main id="view"></main>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="pdf.min.js"></script>
<script src="parser.js"></script>
<script src="core.js"></script>
<script src="brands.js"></script>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
</body>
</html>
